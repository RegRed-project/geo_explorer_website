<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Geographic Entities Explorer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <h2>Geographic Entities Explorer</h2>

    <label>Table</label>
    <select id="table_name"></select>

    <hr>
    <h3>Filters</h3>
    <label>locationID</label>
    <input id="filter_locationID" placeholder="e.g. MOBI_adm0_105">
    <label>Continent</label>
    <input id="filter_continent" placeholder="e.g. Europe">
    <label>Country</label>
    <input id="filter_country" placeholder="e.g. France">
    <label>State / Province</label>
    <input id="filter_stateProvince" placeholder="e.g. Montevideo">
    <label>County</label>
    <input id="filter_county" placeholder="e.g. Bella Unión">
    <label>Locality</label>
    <input id="filter_locality" placeholder="e.g. Paillaco">
    <label>Max rows</label>
    <input id="row_limit" type="number" value="200" min="1" max="2000" step="50">

    <hr>
    <button id="query_btn">Query</button>
    <p class="hint"><em>Filter to 1 row to show its polygon.</em></p>
  </aside>

  <main class="content">
    <p id="row_count"></p>
    <div id="result_table"></div>
    <div id="map_panel"></div>
  </main>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/app.js"></script>
</body>
</html>
